# Digital Identity System — Nginx TLS 1.3 reverse-proxy configuration
# Replace <SERVER_NAME> and certificate paths before deploying.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout 65;

    # ── Disable nginx version disclosure ──────────────────────────────────
    server_tokens off;

    # ── Global security headers (applied in every server block via include) ─
    # Defined here so they can be referenced by add_header in each block.
    # nginx requires add_header in the same block or a child; see below.

    # ── Redirect HTTP → HTTPS ──────────────────────────────────────────────
    server {
        listen 80;
        server_name <SERVER_NAME>;

        # Allow ACME challenge for cert renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Main HTTPS block ───────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name <SERVER_NAME>;

        # ── TLS ────────────────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols             TLSv1.3;
        ssl_prefer_server_ciphers off;       # TLS 1.3 manages ciphers itself

        # Session hardening
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;             # forward secrecy

        # OCSP stapling
        ssl_stapling        on;
        ssl_stapling_verify on;
        resolver            8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout    5s;

        # ── Security headers ───────────────────────────────────────────────
        add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options            "DENY" always;
        add_header X-Content-Type-Options     "nosniff" always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy         "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy    "default-src 'none'; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self';" always;
        add_header X-XSS-Protection           "0" always;   # disabled — CSP is the correct mitigation

        # ── Backend API (Node.js :3001) ────────────────────────────────────
        location /api/ {
            proxy_pass         http://127.0.0.1:3001;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";

            proxy_read_timeout  60s;
            proxy_send_timeout  60s;

            # Strip server identity from upstream
            proxy_hide_header  X-Powered-By;
            proxy_hide_header  Server;

            client_max_body_size 50m;
        }

        # ── Biometric service (Python/Flask :5001) ─────────────────────────
        location /biometric/ {
            proxy_pass         http://127.0.0.1:5001/;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout  120s;   # biometric processing can be slow
            proxy_send_timeout  120s;

            proxy_hide_header  X-Powered-By;
            proxy_hide_header  Server;

            client_max_body_size 50m;  # base64-encoded images
        }

        # ── Health check (no auth required) ───────────────────────────────
        location /health {
            proxy_pass http://127.0.0.1:3001/health;
            access_log off;
        }

        # ── Deny everything else ───────────────────────────────────────────
        location / {
            return 404;
        }
    }
}
