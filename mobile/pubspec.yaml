name: sl_digital_id
description: Sri Lanka Blockchain-based Unified Digital Identity System - Citizen Mobile Application
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Fonts
  google_fonts: ^6.1.0

  # QR Code Generation
  qr_flutter: ^4.1.0

  # Biometric / Device Authentication (FIDO2 platform authenticator)
  local_auth: ^2.1.8

  # Secure local storage for FIDO2 keys
  flutter_secure_storage: ^9.0.0

  # HTTP client for API calls
  http: ^1.1.0

  # Shared preferences for lightweight local data
  shared_preferences: ^2.2.2

  # Intl for date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
