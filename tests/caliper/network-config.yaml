---
# ============================================================
# Hyperledger Caliper — Fabric Network Configuration
# Digital Identity System — Thesis Performance Benchmarks
#
# Compatible with: Caliper 0.5.x + Fabric 2.x test-network
# Channel: identitychannel
# Chaincodes: identity, consent, audit
# ============================================================

name: digital-identity-system
version: "2.0"

caliper:
  blockchain: fabric

#
# Channel and chaincode declarations
# Caliper needs these to know which contracts to target.
#
channels:
  - channelName: identitychannel
    contracts:
      - id: identity      # CreateIdentity, GetIdentity, RevokeIdentity
      - id: consent       # GrantPermission, DeclinePermission, GetConsentProfile
      - id: audit         # LogEvent, GetCitizenAuditLog

#
# Organization identity used by Caliper workers to submit transactions.
# Points to the Admin user of Org1 in the test-network.
#
organizations:
  - mspid: Org1MSP
    identities:
      certificates:
        - name: &admin-id admin-org1
          clientPrivateKey:
            # Wildcard resolved at runtime — the test-network keystore uses a
            # generated filename ending in _sk.
            path: >-
              /mnt/e/digital-identity-system/blockchain/fabric-samples/test-network/organizations/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp/keystore/priv_sk
          clientSignedCert:
            path: >-
              /mnt/e/digital-identity-system/blockchain/fabric-samples/test-network/organizations/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp/signcerts/cert.pem

    connectionProfile:
      # Generated by fabric-samples test-network — contains peer, orderer,
      # CA endpoints and TLS certificates for Org1.
      path: >-
        /mnt/e/digital-identity-system/blockchain/fabric-samples/test-network/organizations/peerOrganizations/org1.example.com/connection-org1.yaml
      discover: true          # use service discovery to find endorsers

#
# Default identity for all rounds (can be overridden per-round in benchmark-config)
#
defaultIdentity: *admin-id
